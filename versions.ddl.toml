# Pinned ecosystem tool versions for this repo's CI and dev setup.
# Standardization §4: installs are pinned, never `latest` — a broken release
# of any tool must not break CI of the whole fleet.
# Update deliberately; the conformance test (dulce-de-leche
# tests/standard_conformance.rs) requires this file to exist.
#
# §4 matrix row (genesis): a lib crate whose CI consumes two family tools for
# its research record and prose gates (kaya, sad — wired via justfile
# record-check/sad-check and the nightly Record workflow). podras is consumed
# locally only: its brief-drift gate is opt-in/manual (`just brief-drift`),
# so CI installs no podras. External: openspec (npm @fission-ai/openspec) is
# used for spec authoring but not installed in CI.

[tools]
kaya = "0.4.1"
sad = "0.2.0"
podras = "0.1.0"

# Patch-bump ledger for genesis itself (Standardization §4): a patch bump
# is a reader/consumer behavior change with no public signature change.
# genesis-jsu: evals `parse_envelope` now unions both hint channels
# (`data.remediation[]` first, then legacy top-level `hints[]`); writers
# are no longer required to emit top-level hints on the error path.
# 0.14.0 (minor): jxg family — `git::staged_files`, batched
# `tracked_paths`/`ignored_paths`, `worktree_facts`/`current_branch`,
# `remote_url`/`remote_key`; git_hooks exit-code discipline + semantic
# idempotence (`is_wired`, per-stage `ensure_wired`); update_check public
# `check_with`/`notice`; envelope caller-supplied `envelope_version` +
# public `current_author`; scratch `ErrorRecord.message`.
# 0.15.0 (minor, genesis-mqt): new public module `genesis::fs` —
# `atomic_write` (fsync + no-follow staging sibling + bounded Windows
# sharing retry), `read_json`/`atomic_write_json`, typed `FsError`.
[packages]
genesis = "0.15.0"
