[package]
name = "genesis-vibes"
version = "0.3.0"
edition = "2024"
description = "Shared crate for cross-cutting CLI/AIX/self-healing infrastructure in the charly-vibes tool suite"
license = "Apache-2.0"
repository = "https://github.com/charly-vibes/genesis"
readme = "README.md"
keywords = ["cli", "infrastructure", "aix", "self-healing", "charly-vibes"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**/*", "/Cargo.toml", "/LICENSE", "/README.md", "/llm.txt", "/llms.txt"]
exclude = [".beads/", ".dont/", ".espectacular/", ".wai/", ".git/", "openspec/", "test.md", "pretender.toml", "testaruda.toml", "_typos.toml", "book.toml", "docs/", "justfile", "lefthook.yml"]

[lib]
name = "genesis"

[dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
miette = { version = "7", features = ["fancy"] }
thiserror = "2"

# CLI argument parsing
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"

# String similarity (suggestions module)
strsim = "0.11"

# Config file parsing
toml = "0.8"

# Regex (feedback redactor)
regex = "1"

# Test fixtures
tempfile = "3"

[dev-dependencies]