[package]
name = "genesis-vibes"
version = "0.15.0"
edition = "2024"
description = "Shared crate for cross-cutting CLI/AIX/self-healing infrastructure in the charly-vibes tool suite"
license = "Apache-2.0"
repository = "https://github.com/charly-vibes/genesis"
readme = "README.md"
keywords = ["cli", "infrastructure", "aix", "self-healing", "charly-vibes"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**/*", "/Cargo.toml", "/LICENSE", "/README.md", "/llm.txt", "/llms.txt"]
exclude = [".beads/", ".dont/", ".espectacular/", ".wai/", ".git/", "openspec/", "test.md", "pretender.toml", "testaruda.toml", "_typos.toml", "book.toml", "docs/", "justfile", "lefthook.yml"]

[lib]
name = "genesis"

# Test harness for the `--version --json` pre-parse (tests/version_json_preparse.rs):
# a real process to assert exit codes and envelopes end to end. Lives under
# tests/ so it is not part of the published package; `required = false` lets
# `cargo publish` (which drops tests/) skip the target instead of failing.
[[bin]]
name = "version-json-probe"
path = "tests/common/version_json_probe.rs"
required = false

[dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"

# CLI argument parsing
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"

# String similarity (suggestions module)
strsim = "0.11"


# Config file parsing
toml = "0.8"

# Regex (feedback redactor)
regex = "1"

# Test fixtures (also used at runtime by `fixture::temp_root`)
tempfile = "3"

# Update check (feature-gated; see `update-check` feature)
semver = { version = "1", optional = true }
ureq = { version = "2", optional = true, default-features = false, features = ["tls"] }

[features]
update-check = ["dep:semver", "dep:ureq"]

[dev-dependencies]
# Doc-example tests (tests/doc_examples.rs) mirror the mdBook snippets and
# need clap derive + serde_json directly. clap/serde_json are regular deps
# of genesis, but integration tests can only import dev-dependencies.
clap = { version = "4", features = ["derive"] }
serde_json = "1"