[pretender]
mode = "gate"
languages = ["auto"]
exclude = ["vendor/**", "node_modules/**", "**/*_generated.*"]

[thresholds]
cyclomatic_max = 5
cognitive_max = 8
function_lines_max = 20
file_lines_max = 300
nesting_max = 2
abc_max = 20
unwrap_max = 0
duplication_pct_max = 3

[roles.test]
paths = ["tests/**", "**/*_test.*", "spec/**"]

[roles.library]
paths = ["pkg/**", "lib/**"]

[roles.script]
paths = ["scripts/**", "examples/**"]

[roles.generated]
paths = ["**/*.pb.go", "**/*_generated.*"]

[roles.vendor]
paths = ["vendor/**", "node_modules/**"]
