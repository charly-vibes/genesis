# lefthook.yml - pre-commit/pre-push hooks
#
# Install: lefthook install
# Bypass (WIP only): git push --no-verify
#
# Warning: --no-verify requires:
#   - Commit message MUST contain "WIP" or "wip"
#   - Tests MUST be fixed before merging

pre-commit:
# ah:managed:start
  ah-check:
    run: ah check
# ah:managed:end

  parallel: true
  commands:
    bd:
      run: bd hooks run pre-commit
    format-check:
      glob: "*.rs"
      run: just fmt-check
    lint:
      glob: "*.rs"
      run: just lint
    testaruda:
      run: testaruda select --safe --base origin/main --head HEAD

pre-push:
  commands:
    bd:
      run: bd hooks run pre-push
    testaruda:
      run: testaruda select --safe --base origin/main --head HEAD
    pretender:
      # §9: mode explicit BY CHOICE — tiered is advisory (always exit 0);
      # upgrading to --mode gate requires tuning [thresholds] to baseline
      # first (genesis src/ has 57 violations under strict defaults).
      run: pretender check --mode tiered --advisory-until 2027-03-31 src/
    validate:
      run: ah check