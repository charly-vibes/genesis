# lefthook.yml - pre-commit/pre-push hooks
#
# Install: lefthook install
# Bypass (WIP only): git push --no-verify
#
# Warning: --no-verify requires:
#   - Commit message MUST contain "WIP" or "wip"
#   - Tests MUST be fixed before merging

pre-commit:
# ah:managed:start
  ah-check:
    run: ah check
# ah:managed:end

  parallel: true
  commands:
# sad:managed:start
    sad-check:
      run: sad check
# sad:managed:end
# kaya:managed:start
    kaya-check:
      run: kaya check --index
# kaya:managed:end

    # Opt-in committed-render drift gate (podras ships it commented out too):
    # running it per-commit forces a render regeneration before EVERY commit
    # (each new commit invalidates the committed renders). Run `just
    # brief-drift` manually after regenerating renders instead. Requires
    # `podras` on PATH, or set PODRAS_BIN in the hook environment.
    # brief-drift:
    #   run: scripts/guards/brief-drift.sh
    # ddl:managed:start (pre-commit)
    ddl-ah-check:
      run: ah check
    ddl-pretender-gate:
      run: pretender check --diff-only --mode gate
    ddl-spk-lint:
      run: spk lint openspec/specs || test $? -eq 2
    # ddl:managed:end (pre-commit)
    bd:
      run: bd hooks run pre-commit
    format-check:
      glob: "*.rs"
      run: just fmt-check
    lint:
      glob: "*.rs"
      run: just lint
    testaruda:
      run: testaruda select --safe --base origin/main --head HEAD

pre-push:
  commands:
# sad:managed:start
    sad-check:
      run: sad check
# sad:managed:end
# kaya:managed:start
    kaya-check:
      run: kaya check
# kaya:managed:end
    # ddl:managed:start (pre-push)
    ddl-ah-check:
      run: ah check
    # ddl:managed:end (pre-push)
    bd:
      run: bd hooks run pre-push
    testaruda:
      run: testaruda select --safe --base origin/main --head HEAD
    pretender:
      # §9: mode explicit BY CHOICE — tiered is advisory (always exit 0);
      # upgrading to --mode gate requires tuning [thresholds] to baseline
      # first (genesis src/ has 57 violations under strict defaults).
      run: pretender check --mode tiered --advisory-until 2027-03-31 src/
    validate:
      run: ah check
