# CI workflow - runs the same commands as local development
#
# Uses `just ci` to ensure parity between local and CI environments.
# If CI fails, run `just ci` locally to reproduce the issue.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install just
        uses: extractions/setup-just@v2

      # Run the exact same command as local development
      - name: Install mdBook
        uses: taiki-e/install-action@mdbook

      # Fleet tooling consumed by `just ci`, pinned per versions.ddl.toml
      # (Standardization §4: installs are pinned, never latest). podras is not
      # installed here: its brief-drift gate is opt-in/manual (`just
      # brief-drift`), consumed locally only.
      - name: Install fleet tools (kaya, sad)
        run: |
          cargo install --locked --git https://github.com/charly-vibes/kaya --tag v0.4.1 kaya-vibes
          cargo install --locked --git https://github.com/charly-vibes/sad --tag v0.2.0 sad-vibes

      # DDL-43g: smoke our own live Pages URL — a 404'd book must fail this
      # repo's CI immediately, not wait for the next hub conformance run.
      - name: Smoke live Pages URL
        run: curl -fsS --max-time 10 --retry 2 https://charly-vibes.github.io/genesis/ >/dev/null
      - name: Run CI pipeline
        run: just ci